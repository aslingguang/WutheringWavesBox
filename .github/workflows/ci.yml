name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore native/WutheringWavesBox.slnx
      - run: dotnet build native/WutheringWavesBox.slnx --no-restore --configuration Release
      - run: dotnet test native/WutheringWavesBox.slnx --no-build --configuration Release
